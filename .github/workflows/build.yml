name: Build RPi OS arm64 (Trixie) - Lite and Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build.yml
      - config
      - lite-extras/**
      - desktop-extras/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      # Create a valid pi-gen config if it's missing (no heredoc; ASCII only)
      - name: Ensure pi-gen config exists
        run: |
          set -eux
          if [ ! -f config ]; then
            : > config
            printf '%s\n' \
              '# ---- Image basics ----' \
              'IMG_NAME="rpios-arm64"' \
              'RELEASE="trixie"' \
              'PI_GEN_RELEASE="Raspberry Pi reference"' \
              '' \
              '# ---- Compression ----' \
              'DEPLOY_COMPRESSION="xz"' \
              'COMPRESSION_LEVEL="6"' \
              '' \
              '# ---- Identity / login ----' \
              'TARGET_HOSTNAME="rpi"' \
              'FIRST_USER_NAME="pi"' \
              'FIRST_USER_PASS=""' \
              'DISABLE_FIRST_BOOT_USER_RENAME="0"' \
              '' \
              '# ---- Regional ----' \
              'LOCALE_DEFAULT="en_CA.UTF-8"' \
              'TIMEZONE_DEFAULT="America/Halifax"' \
              'KEYBOARD_KEYMAP="ca"' \
              'KEYBOARD_LAYOUT="English (Canada)"' \
              '' \
              '# ---- Connectivity ----' \
              'WPA_COUNTRY="CA"' \
              'ENABLE_SSH="1"' \
              'PUBKEY_ONLY_SSH="0"' \
              >> config
          fi
          echo "---- config ----"
          cat config

      # Create custom stages & package lists if missing (no heredoc)
      - name: Ensure custom stage folders and package lists
        run: |
          set -eux
          mkdir -p lite-extras/01-packages desktop-extras/01-packages

          # prerun.sh for both (no heredoc; exact content)
          for d in lite-extras desktop-extras; do
            if [ ! -f "$d/prerun.sh" ]; then
              : > "$d/prerun.sh"
              printf '%s\n' \
                '#!/bin/bash -e' \
                'if [ ! -d "${ROOTFS_DIR}" ]; then' \
                '  mkdir -p "${ROOTFS_DIR}"' \
                'fi' \
                'if [ -d "${PREV_ROOTFS_DIR}" ]; then' \
                '  rsync -aHAXx --numeric-ids --delete "${PREV_ROOTFS_DIR}/" "${ROOTFS_DIR}/"' \
                'fi' \
                > "$d/prerun.sh"
              chmod +x "$d/prerun.sh"
            fi
          done

          # Lite package list
          if [ ! -f "lite-extras/01-packages/00-packages" ]; then
            : > lite-extras/01-packages/00-packages
            printf '%s\n' \
              htop nano git curl wget net-tools usbutils build-essential \
              python3 python3-pip nodejs npm python3-rpi.gpio \
              apache2 mariadb-server php samba \
              > lite-extras/01-packages/00-packages
          fi

          # Desktop package list
          if [ ! -f "desktop-extras/01-packages/00-packages" ]; then
            : > desktop-extras/01-packages/00-packages
            printf '%s\n' \
              htop nano git curl wget net-tools usbutils build-essential \
              python3 python3-pip nodejs npm python3-rpi.gpio \
              apache2 mariadb-server php samba \
              chromium vlc gimp libreoffice thunderbird geany \
              > desktop-extras/01-packages/00-packages
          fi

      - name: Clone official pi-gen (arm64)
        run: |
          set -eux
          git clone --branch arm64 --depth 1 https://github.com/RPi-Distro/pi-gen.git pi-gen-src
          ls -la pi-gen-src

      - name: Inject config and custom stages
        run: |
          set -eux
          cp -f config pi-gen-src/config
          cp -r lite-extras pi-gen-src/lite-extras
          cp -r desktop-extras pi-gen-src/desktop-extras
          chmod +x pi-gen-src/lite-extras/prerun.sh
          chmod +x pi-gen-src/desktop-extras/prerun.sh
          
      - name: Setup QEMU on host (binfmt + static binaries)
        run: |
          set -eux
          sudo apt-get update
          # Install static ARM emulators and ensure binfmt registration on the host
          sudo apt-get install -y qemu-user-static binfmt-support
          # Refresh/ensure binfmt handlers for arm64 are active
          docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build images via pi-gen Docker
        env:
          STAGE_LIST: stage0 stage1 ./lite-extras stage2 stage3 ./desktop-extras stage4
        run: |
          set -eux
          cd pi-gen-src
          echo "Using STAGE_LIST=${STAGE_LIST}"
          ./build-docker.sh

      - name: Collect and rename artifacts
        run: |
          set -eux
          DEPLOY_DIR=$(find pi-gen-src -type d -name deploy | head -n1)
          mkdir -p out
          # Try to pick Lite/Desktop by filename, fallback to newest two
          LITE=$(ls -1t "$DEPLOY_DIR"/*lite*.img.xz 2>/dev/null | head -n1 || true)
          DESKTOP=$(ls -1t "$DEPLOY_DIR"/*.img.xz 2>/dev/null | grep -v lite | head -n1 || true)
          if [ -z "$LITE" ] || [ -z "$DESKTOP" ]; then
            TWO=$(ls -1t "$DEPLOY_DIR"/*.img.xz | head -n2 | tac)
            LITE=$(echo "$TWO" | head -n1)
            DESKTOP=$(echo "$TWO" | tail -n1)
          fi
          cp "$LITE"    out/rpios-arm64-lite.img.xz
          cp "$DESKTOP" out/rpios-arm64-desktop.img.xz
          (cd out && sha256sum *.img.xz > sha256sums.txt)
          ls -lh out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_id }}
          name: RPi OS arm64 (Trixie) - Lite and Desktop
          files: |
            out/rpios-arm64-lite.img.xz
            out/rpios-arm64-desktop.img.xz
            out/sha256sums.txt
