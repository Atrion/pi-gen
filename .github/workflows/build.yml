name: Build RPi OS arm64 (Trixie) - Lite and Desktop (Split Jobs)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.flavor }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: lite
            stage_list: "stage0 stage1 ./lite-extras stage2"
            out_name: "rpios-arm64-lite.img.xz"
          - flavor: desktop
            stage_list: "stage0 stage1 stage2 stage3 ./desktop-extras stage4"
            out_name: "rpios-arm64-desktop.img.xz"

    steps:
      - name: Check out this repo (config + extras)
        uses: actions/checkout@v4

      # Free a lot of space and move Docker's data root onto the big /mnt volume
      - name: Free disk space (aggressive)
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          sudo docker system prune -af || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker || true
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo mkdir -p /mnt/docker
          sudo systemctl start docker
          df -h

      # Register binfmt for arm64 (helps chroots inside the container)
      - name: Setup QEMU/binfmt on host
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      # >>> THIS IS THE MISSING PIECE <<<
      # Install the actual qemu-user-static binary on the HOST so pi-gen can bind-mount it.
      - name: Install qemu-user-static on host
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable

      # Create config if missing (your requested settings)
      - name: Create pi-gen config if missing
        run: |
          set -eux
          if [ ! -f config ]; then
            : > config
            printf '%s\n' \
              '# ---- Image basics ----' \
              'IMG_NAME="rpios-arm64"' \
              'RELEASE="trixie"' \
              'PI_GEN_RELEASE="Raspberry Pi reference"' \
              '' \
              '# ---- Compression ----' \
              'DEPLOY_COMPRESSION="xz"' \
              'COMPRESSION_LEVEL="6"' \
              '' \
              '# ---- Identity / login ----' \
              'TARGET_HOSTNAME="rpi"' \
              'FIRST_USER_NAME="pi"' \
              'FIRST_USER_PASS=""' \
              'DISABLE_FIRST_BOOT_USER_RENAME="0"' \
              '' \
              '# ---- Regional ----' \
              'LOCALE_DEFAULT="en_CA.UTF-8"' \
              'TIMEZONE_DEFAULT="America/Halifax"' \
              'KEYBOARD_KEYMAP="ca"' \
              'KEYBOARD_LAYOUT="English (Canada)"' \
              '' \
              '# ---- Connectivity ----' \
              'WPA_COUNTRY="CA"' \
              'ENABLE_SSH="1"' \
              'PUBKEY_ONLY_SSH="0"' \
              >> config
          fi
          echo "---- config ----"
          cat config

      # Ensure custom stages & package lists (no heredocs; safe package names)
      - name: Ensure custom stage folders and package lists
        run: |
          set -eux
          mkdir -p lite-extras/01-packages desktop-extras/01-packages
          for d in lite-extras desktop-extras; do
            if [ ! -f "$d/prerun.sh" ]; then
              : > "$d/prerun.sh"
              printf '%s\n' \
                '#!/bin/bash -e' \
                'if [ ! -d "${ROOTFS_DIR}" ]; then' \
                '  mkdir -p "${ROOTFS_DIR}"' \
                'fi' \
                'if [ -d "${PREV_ROOTFS_DIR}" ]; then' \
                '  rsync -aHAXx --numeric-ids --delete "${PREV_ROOTFS_DIR}/" "${ROOTFS_DIR}/"' \
                'fi' \
                > "$d/prerun.sh"
              chmod +x "$d/prerun.sh"
            fi
          done

          # Lite packages (note: usbutils provides lsusb; no wiringpi on trixie)
          if [ ! -f "lite-extras/01-packages/00-packages" ]; then
            : > lite-extras/01-packages/00-packages
            printf '%s\n' \
              htop nano git curl wget net-tools usbutils build-essential \
              python3 python3-pip nodejs npm python3-rpi.gpio \
              apache2 mariadb-server php samba \
              > lite-extras/01-packages/00-packages
          fi

          # Desktop packages (chromium, not chromium-browser)
          if [ ! -f "desktop-extras/01-packages/00-packages" ]; then
            : > desktop-extras/01-packages/00-packages
            printf '%s\n' \
              htop nano git curl wget net-tools usbutils build-essential \
              python3 python3-pip nodejs npm python3-rpi.gpio \
              apache2 mariadb-server php samba \
              chromium vlc gimp libreoffice thunderbird geany \
              > desktop-extras/01-packages/00-packages
          fi

      - name: Clone official pi-gen (arm64)
        run: |
          set -eux
          git clone --branch arm64 --depth 1 https://github.com/RPi-Distro/pi-gen.git pi-gen-src
          ls -la pi-gen-src

      - name: Inject config and custom stages
        run: |
          set -eux
          cp -f config pi-gen-src/config
          cp -r lite-extras pi-gen-src/lite-extras
          cp -r desktop-extras pi-gen-src/desktop-extras
          chmod +x pi-gen-src/lite-extras/prerun.sh
          chmod +x pi-gen-src/desktop-extras/prerun.sh

      - name: Build image via pi-gen Docker
        env:
          STAGE_LIST: ${{ matrix.stage_list }}
        run: |
          set -eux
          cd pi-gen-src
          echo "Using STAGE_LIST=${STAGE_LIST}"
          ./build-docker.sh

      - name: Collect artifact
        run: |
          set -eux
          DEPLOY_DIR=$(find pi-gen-src -type d -name deploy | head -n1)
          mkdir -p out
          IMG=$(ls -1t "$DEPLOY_DIR"/*.img.xz | head -n1)
          cp "$IMG" "out/${{ matrix.out_name }}"
          (cd out && sha256sum "${{ matrix.out_name }}" > "${{ matrix.out_name }}.sha256")
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_name }}
          path: |
            out/${{ matrix.out_name }}
            out/${{ matrix.out_name }}.sha256

  release:
    name: Create combined GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Lite artifact
        uses: actions/download-artifact@v4
        with:
          name: rpios-arm64-lite.img.xz

      - name: Download Desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: rpios-arm64-desktop.img.xz

      - name: Combine checksums
        run: |
          set -eux
          cat rpios-arm64-lite.img.xz.sha256 rpios-arm64-desktop.img.xz.sha256 > sha256sums.txt
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_id }}
          name: RPi OS arm64 (Trixie) - Lite and Desktop
          files: |
            rpios-arm64-lite.img.xz
            rpios-arm64-desktop.img.xz
            sha256sums.txt
