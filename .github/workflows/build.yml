name: Build RPi OS arm64 (Trixie) - Lite, Desktop, Full, Kiosk

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.flavor }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: lite
            stage_list: "stage0 stage1 ./lite-extras stage2"
            out_name: "rpios-arm64-lite.img.xz"
          - flavor: desktop
            stage_list: "stage0 stage1 stage2 stage3 ./desktop-extras stage4"
            out_name: "rpios-arm64-desktop.img.xz"
          - flavor: desktop-full
            stage_list: "stage0 stage1 stage2 stage3 ./desktop-extras stage4 stage5"
            out_name: "rpios-arm64-desktop-full.img.xz"
          - flavor: kiosk
            stage_list: "stage0 stage1 stage2 stage3 ./kiosk-extras stage4"
            out_name: "rpios-arm64-kiosk.img.xz"
          - flavor: lite-base
            stage_list: "stage0 stage1 stage2"
            out_name: "rpios-arm64-lite-base.img.xz"

    steps:

      - name: Download Lite Base artifact

        uses: actions/download-artifact@v4

        with:

          name: rpios-arm64-lite-base.img.xz

      - name: Check out this repo (config + extras)
        uses: actions/checkout@v4

      - name: Free disk space (aggressive)
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          sudo docker system prune -af || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker || true
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo mkdir -p /mnt/docker
          sudo systemctl start docker
          df -h

      - name: Setup QEMU/binfmt on host
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Install qemu-user-static on host
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable

      - name: Create pi-gen config if missing
        run: |
          set -eux
          if [ ! -f config ]; then
            : > config
            printf '%s\n' \
              '# ---- Image basics ----' \
              'IMG_NAME="rpios-arm64"' \
              'RELEASE="trixie"' \
              'PI_GEN_RELEASE="Raspberry Pi reference"' \
              '' \
              '# ---- Compression ----' \
              'DEPLOY_COMPRESSION="xz"' \
              'COMPRESSION_LEVEL="6"' \
              '' \
              '# ---- Identity / login ----' \
              'TARGET_HOSTNAME="rpi"' \
              'FIRST_USER_NAME="pi"' \
              'FIRST_USER_PASS=""' \
              'DISABLE_FIRST_BOOT_USER_RENAME="0"' \
              '' \
              '# ---- Regional ----' \
              'LOCALE_DEFAULT="en_CA.UTF-8"' \
              'TIMEZONE_DEFAULT="America/Halifax"' \
              'KEYBOARD_KEYMAP="ca"' \
              'KEYBOARD_LAYOUT="English (Canada)"' \
              '' \
              '# ---- Connectivity ----' \
              'WPA_COUNTRY="CA"' \
              'ENABLE_SSH="1"' \
              'PUBKEY_ONLY_SSH="0"' \
              >> config
          fi
          echo "---- config ----"
          cat config

      - name: Ensure custom stage folders and package lists
        run: |
          set -eux
          mkdir -p lite-extras/01-packages desktop-extras/01-packages kiosk-extras/01-packages

          # prerun.sh for all custom stages
          for d in lite-extras desktop-extras kiosk-extras; do
            if [ ! -f "$d/prerun.sh" ]; then
              : > "$d/prerun.sh"
              printf '%s\n' \
                '#!/bin/bash -e' \
                'if [ ! -d "${ROOTFS_DIR}" ]; then' \
                '  mkdir -p "${ROOTFS_DIR}"' \
                'fi' \
                'if [ -d "${PREV_ROOTFS_DIR}" ]; then' \
                '  rsync -aHAXx --numeric-ids --delete "${PREV_ROOTFS_DIR}/" "${ROOTFS_DIR}/"' \
                'fi' \
                > "$d/prerun.sh"
              chmod +x "$d/prerun.sh"
            fi
          done

          # Lite package list
          if [ ! -f "lite-extras/01-packages/00-packages" ]; then
            : > lite-extras/01-packages/00-packages
            printf '%s\n' \
              htop nano git curl wget net-tools usbutils build-essential \
              python3 python3-pip nodejs npm python3-rpi.gpio \
              apache2 mariadb-server php samba \
              > lite-extras/01-packages/00-packages
          fi

          # Desktop package list
          if [ ! -f "desktop-extras/01-packages/00-packages" ]; then
            : > desktop-extras/01-packages/00-packages
            printf '%s\n' \
              htop nano git curl wget net-tools usbutils build-essential \
              python3 python3-pip nodejs npm python3-rpi.gpio \
              apache2 mariadb-server php samba \
              chromium vlc gimp libreoffice thunderbird geany \
              > desktop-extras/01-packages/00-packages
          fi

          # Kiosk package list
          if [ ! -f "kiosk-extras/01-packages/00-packages" ]; then
            : > kiosk-extras/01-packages/00-packages
            printf '%s\n' \
              chromium xserver-xorg x11-xserver-utils xinit openbox unclutter \
              > kiosk-extras/01-packages/00-packages
          fi

          # Kiosk setup script (no YAML heredocs; build script lines via echo)
          if [ ! -f "kiosk-extras/02-run-chroot.sh" ]; then
            : > kiosk-extras/02-run-chroot.sh
            chmod +x kiosk-extras/02-run-chroot.sh
            {
              echo '#!/bin/bash -e'
              echo 'install -d -m 0755 /etc/systemd/system/getty@tty1.service.d'
              echo 'cat > /etc/systemd/system/getty@tty1.service.d/override.conf << "EOT"'
              echo '[Service]'
              echo 'ExecStart='
              echo 'ExecStart=-/sbin/agetty --autologin pi --noclear %I $TERM'
              echo 'EOT'
              echo ''
              echo 'for dm in lightdm sddm gdm3 nodm lxdm; do'
              echo '  systemctl disable "$dm" 2>/dev/null || true'
              echo 'done'
              echo ''
              echo 'install -d -m 0700 /home/pi'
              echo 'if ! id -u pi >/dev/null 2>&1; then'
              echo '  useradd -m -s /bin/bash pi || true'
              echo 'fi'
              echo 'chown -R pi:pi /home/pi'
              echo ''
              echo 'cat > /home/pi/.bash_profile << "EOT"'
              echo 'if [ -z "$DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ]; then'
              echo '  startx'
              echo 'fi'
              echo 'EOT'
              echo 'chown pi:pi /home/pi/.bash_profile'
              echo 'chmod 0644 /home/pi/.bash_profile'
              echo ''
              echo 'cat > /home/pi/.xinitrc << "EOT"'
              echo '#!/bin/sh'
              echo 'xset -dpms'
              echo 'xset s off'
              echo 'xset s noblank'
              echo 'unclutter -idle 0.5 -root &'
              echo 'URL="about:blank"'
              echo 'if [ -f /boot/kiosk-url.txt ]; then'
              echo '  URL="$(head -n1 /boot/kiosk-url.txt)"'
              echo 'fi'
              echo 'openbox-session &'
              echo 'sleep 2'
              echo 'chromium --kiosk --no-first-run --incognito --overscroll-history-navigation=0 "$URL"'
              echo 'EOT'
              echo 'chown pi:pi /home/pi/.xinitrc'
              echo 'chmod 0755 /home/pi/.xinitrc'
              echo ''
              echo 'echo "about:blank" > /boot/kiosk-url.txt'
              echo ''
              echo 'systemctl daemon-reload'
              echo 'systemctl enable getty@tty1.service'
            } >> kiosk-extras/02-run-chroot.sh
          fi

      - name: Clone official pi-gen (arm64)
        run: |
          set -eux
          git clone --branch arm64 --depth 1 https://github.com/RPi-Distro/pi-gen.git pi-gen-src
          ls -la pi-gen-src

      - name: Inject config and custom stages
        run: |
          set -eux
          cp -f config pi-gen-src/config
          cp -r lite-extras pi-gen-src/lite-extras
          cp -r desktop-extras pi-gen-src/desktop-extras
          cp -r kiosk-extras pi-gen-src/kiosk-extras
          chmod +x pi-gen-src/lite-extras/prerun.sh
          chmod +x pi-gen-src/desktop-extras/prerun.sh
          chmod +x pi-gen-src/kiosk-extras/prerun.sh
          [ -f pi-gen-src/kiosk-extras/02-run-chroot.sh ] && chmod +x pi-gen-src/kiosk-extras/02-run-chroot.sh || true

      - name: Build image via pi-gen Docker
        env:
          STAGE_LIST: ${{ matrix.stage_list }}
        run: |
          set -eux
          cd pi-gen-src
          echo "Using STAGE_LIST=${STAGE_LIST}"
          ./build-docker.sh

      - name: Collect artifact
        run: |
          set -eux
          DEPLOY_DIR=$(find pi-gen-src -type d -name deploy | head -n1)
          mkdir -p out
          IMG=$(ls -1t "$DEPLOY_DIR"/*.img.xz | head -n1)
          cp "$IMG" "out/${{ matrix.out_name }}"
          (cd out && sha256sum "${{ matrix.out_name }}" > "${{ matrix.out_name }}.sha256")
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_name }}
          path: |
            out/${{ matrix.out_name }}
            out/${{ matrix.out_name }}.sha256

release:

  name: Create combined GitHub Release

  runs-on: ubuntu-latest

  needs: build

  env:

    REL: trixie  # keep in sync with RELEASE in the config step

  steps:

    - name: Download all image artifacts

      uses: actions/download-artifact@v4

      with:

        pattern: "*.img.xz"

        merge-multiple: true



    - name: Build manifest

      id: manifest

      run: |

        set -eux

        {

          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" 

          echo "repo_commit=${GITHUB_SHA}"

          echo "workflow_run=${GITHUB_RUN_ID}"

          echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"

          echo "release=${REL}"

          echo "arch=arm64"

          echo "runner=${{ runner.os }} $(uname -r)"

        } > build-info.txt

        cat build-info.txt



    - name: Compute tag

      id: tag

      run: |

        set -eux

        echo "ts=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

        echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"



    - name: Uppercase REL for display

      run: |

        set -eux

        echo "REL_UPPER=${REL^^}" >> "$GITHUB_ENV"



    - name: Build checksums

      run: |

        set -eux

        ls -lh *.img.xz

        : > sha256sums.txt

        for f in *.img.xz; do

          sha256sum "$f" | tee "$f.sha256" >> sha256sums.txt

        done



    - name: Publish GitHub Release

      uses: softprops/action-gh-release@v2

      with:

        tag_name: rpios-${{ env.REL }}-arm64-${{ steps.tag.outputs.ts }}-${{ steps.tag.outputs.short }}

        name: RPi OS arm64 (${{ env.REL_UPPER }}) - Images - ${{ steps.tag.outputs.ts }}

        body: |

          **Raspberry Pi OS (arm64) — ${{ env.REL }}**



          This release includes prebuilt images (compressed `.img.xz`) generated with pi-gen on GitHub Actions.

          Each variant targets a different use-case:



          - **rpios-arm64-lite-base.img.xz** — Bare Raspberry Pi OS Lite (**stage2**). Minimal footprint, no extras.

          - **rpios-arm64-lite.img.xz** — Lite **plus server/dev tools**: htop, nano, git, curl, wget, usbutils, build-essential, python3, python3-pip, nodejs, npm, python3-rpi.gpio, apache2, mariadb-server, php, samba.

          - **rpios-arm64-desktop.img.xz** — Standard Desktop (**stage4**) + extras: chromium, vlc, gimp, libreoffice, thunderbird, geany (plus base utilities).

          - **rpios-arm64-desktop-full.img.xz** — Desktop + **Recommended Software** (**stage5**) plus the same extras.

          - **rpios-arm64-kiosk.img.xz** — Desktop with **Chromium kiosk** (auto-login on tty1, startx, openbox, chromium in `--kiosk --incognito`).

            Change the start URL by editing **/boot/kiosk-url.txt** on the flashed card.



          **Common defaults**

          - Hostname: `rpi`

          - First user: `pi` (created by first-boot wizard; password set on first boot; user rename allowed)

          - SSH: enabled (password login allowed by default)

          - Locale: `en_CA.UTF-8`, Timezone: `America/Halifax`, Keyboard: `ca`

          - Compression: `xz` level `6`



          **Verification & metadata**

          - Checksums: `sha256sums.txt`

          - Build manifest: `build-info.txt` (UTC timestamp, commit, runner, release, arch)



          **Flashing**

          Use **Raspberry Pi Imager** or **balenaEtcher** and select the `.img.xz` directly (no manual decompression needed).

        files: |

          *.img.xz

          *.img.xz.sha256

          sha256sums.txt

          build-info.txt
