name: Build RPi OS arm64 (Trixie) — Lite + Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "config"
      - "lite-extras/**"
      - "desktop-extras/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out your fork (arm64 branch)
        uses: actions/checkout@v4

      # Free space so the Docker build has room
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      # Safety: make sure our custom stage folders exist
      - name: Ensure custom stage folders exist
        run: |
          set -eux
          mkdir -p lite-extras/01-packages desktop-extras/01-packages

      # Build via official pi-gen Docker script (supports RELEASE=trixie)
      - name: Build images with pi-gen (Docker)
        env:
          # pi-gen reads these from ./config (below). STAGE_LIST is here:
          STAGE_LIST: "stage0 stage1 ./lite-extras stage2 stage3 ./desktop-extras stage4"
        run: |
          set -eux
          # We’re already in the pi-gen repo (your fork) on the arm64 branch.
          # Confirm RELEASE default + STAGE_LIST override.
          echo "Using STAGE_LIST=${STAGE_LIST}"
          ./build-docker.sh

      # Collect and rename outputs to your requested filenames
      - name: Collect and rename artifacts
        run: |
          set -eux
          DEPLOY_DIR=$(find . -type d -name deploy | head -n1)
          mkdir -p out
          # Pick newest lite + desktop .img.xz and rename:
          LITE=$(ls -1t "$DEPLOY_DIR"/*lite*.img.xz | head -n1)
          DESKTOP=$(ls -1t "$DEPLOY_DIR"/*.img.xz | grep -v lite | head -n1)
          cp "$LITE"    out/rpios-arm64-lite.img.xz
          cp "$DESKTOP" out/rpios-arm64-desktop.img.xz
          (cd out && sha256sum *.img.xz > sha256sums.txt)
          ls -lh out

      # Publish a Release with both images + checksums
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_id }}
          name: "RPi OS arm64 (Trixie) — Lite + Desktop"
          files: |
            out/rpios-arm64-lite.img.xz
            out/rpios-arm64-desktop.img.xz
            out/sha256sums.txt
